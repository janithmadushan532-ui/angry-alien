name: Unzip File
on: [push]
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip File
        run: |
          unzip -o *.zip
          rm *.zip
      - name: Save Files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto Extracted" || echo "Done"
          git push 
